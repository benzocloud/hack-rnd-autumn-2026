approval_policy = "never"
sandbox_mode = "read-only"
forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"

[mcp_servers.gbrain]
url = "http://127.0.0.1:3131/mcp"
bearer_token_env_var = "GBRAIN_REVIEW_TOKEN"
# Deferred by ADR-010. Enable explicitly after the memory service is verified.
enabled = false
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["recall", "entity", "context_pack", "delta"]
