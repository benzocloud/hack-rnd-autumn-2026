name: Go API transport checks

on:
  pull_request:
    paths: ['services/api/**', 'services/auth/**', 'services/core/**', 'testdata/company-bootstrap-fingerprint-v1.json', 'proto/auth/**', 'proto/core/**', 'docs/api/**', 'docs/auth/**', 'docs/data-contracts/**', 'buf*.yaml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: services/api

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, saldo-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: services/api
          install-only: true
          skip-cache: true
      - name: Install isolated contract test tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/api-python"
          "$RUNNER_TEMP/api-python/bin/python" -m pip install -r requirements-dev.txt
      - name: Install protobuf compiler and pinned Go plugins
        run: |
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build, test, race, coverage, vet, lint, process smoke and OpenAPI contracts
        env:
          PYTHON: ${{ runner.temp }}/api-python/bin/python
          CGO_ENABLED: '1'
        run: bash scripts/check.sh
      - name: Run the live company onboarding chain
        run: go test -tags=onboarding -count=1 -timeout=20m -run '^TestRealCompanyOnboardingChain$' ./integration
      - name: Verify dependency checksums
        run: go mod verify

      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  onboarding:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Real company onboarding
    runs-on: [self-hosted, Linux, X64, saldo-ci]
    timeout-minutes: 15
    services:
      authdb:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: onboarding_test
          POSTGRES_PASSWORD: onboarding_test_only
          POSTGRES_DB: saldo_onboarding_auth_test
        ports: ['127.0.0.1::5432']
        options: >-
          --health-cmd "pg_isready -U onboarding_test -d saldo_onboarding_auth_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      coredb:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: onboarding_test
          POSTGRES_PASSWORD: onboarding_test_only
          POSTGRES_DB: saldo_onboarding_core_test
        ports: ['127.0.0.1::5432']
        options: >-
          --health-cmd "pg_isready -U onboarding_test -d saldo_onboarding_core_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: services/api
          install-only: true
          skip-cache: true
      - name: Install psql and pinned migration CLI
        run: |
          psql --version
          go install github.com/pressly/goose/v3/cmd/goose@v3.29.0
      - name: Mark disposable databases and run real HTTPS/mTLS/process/recovery gate
        env:
          CGO_ENABLED: '1'
          AUTH_TEST_PORT: ${{ job.services.authdb.ports['5432'] }}
          CORE_TEST_PORT: ${{ job.services.coredb.ports['5432'] }}
          PGPASSWORD: onboarding_test_only
          API_ONBOARDING_AUTH_DATABASE_URL: postgres://onboarding_test:onboarding_test_only@127.0.0.1:${{ job.services.authdb.ports['5432'] }}/saldo_onboarding_auth_test?sslmode=disable
          API_ONBOARDING_CORE_DATABASE_URL: postgres://onboarding_test:onboarding_test_only@127.0.0.1:${{ job.services.coredb.ports['5432'] }}/saldo_onboarding_core_test?sslmode=disable
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p "$AUTH_TEST_PORT" -U onboarding_test -d saldo_onboarding_auth_test -c "ALTER DATABASE saldo_onboarding_auth_test SET saldo.test_database='saldo-auth-integration'"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p "$CORE_TEST_PORT" -U onboarding_test -d saldo_onboarding_core_test -c "ALTER DATABASE saldo_onboarding_core_test SET saldo.test_database='saldo-core-integration'"
          go test -tags=onboardingintegration -race -count=1 -timeout=4m -v -run '^TestRealCompanyOnboardingProcesses$' ./integration
          golangci-lint run --build-tags=onboardingintegration ./...
