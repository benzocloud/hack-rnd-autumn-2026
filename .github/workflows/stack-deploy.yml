name: Integrated Saldo deployment

on:
  push:
    branches: [main]
    paths: ['services/**', 'proto/**', 'frontend/**', 'deploy/stack/**', '.github/workflows/stack-deploy.yml']
  workflow_dispatch:
  pull_request:
    paths: ['deploy/stack/**', '.github/workflows/stack-deploy.yml']

permissions:
  contents: read

concurrency:
  group: saldo-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, saldo-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.27.3', cache: false}
      - name: Check Go runtime unit tests
        run: |
          for service in api auth core; do
            (cd "services/$service" && go test -short ./...)
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - name: Verify frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run typecheck
      - name: Check deployment scripts
        run: |
          shellcheck deploy/stack/*.sh
          python3 -m py_compile deploy/stack/*.py
          python3 -m unittest discover -s deploy/stack -p 'test_*.py'

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: [self-hosted, Linux, X64, saldo-ci, saldo-build]
    timeout-minutes: 60
    permissions: {contents: read, packages: write}
    outputs:
      api: ${{ steps.images.outputs.api }}
      auth: ${{ steps.images.outputs.auth }}
      core: ${{ steps.images.outputs.core }}
      ml: ${{ steps.images.outputs.ml }}
      frontend: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          name: saldo-stack
          keep-state: true
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images serially and export immutable digests
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for service in api auth core ml frontend-real; do
            context=.
            file=deploy/stack/Dockerfile.go
            if [[ "$service" == ml ]]; then file=deploy/stack/Dockerfile.ml; fi
            if [[ "$service" == frontend-real ]]; then context=frontend; file=frontend/Dockerfile; fi
            publish=()
            if [[ "$EVENT_NAME" == pull_request ]]; then
              publish+=(--check)
            else
              publish+=(--push)
            fi
            metadata="$RUNNER_TEMP/saldo-$service.json"
            docker buildx build --file "$file" --platform linux/amd64 \
              --tag "ghcr.io/benzocloud/saldo-$service:sha-$REVISION" \
              --build-arg "SERVICE=$service" --build-arg developerMode=dev \
              --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
              --build-arg NODE_OPTIONS=--max-old-space-size=1536 \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --metadata-file "$metadata" "${publish[@]}" "$context"
            if [[ "$EVENT_NAME" != pull_request ]]; then
              digest=$(jq -r '."containerimage.digest"' "$metadata")
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
              output=$service
              if [[ "$service" == frontend-real ]]; then output=frontend; fi
              printf '%s=%s\n' "$output" "$digest" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy:
    needs: image
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: [self-hosted, Linux, X64, saldo-ci]
    timeout-minutes: 15
    environment: frontend-mock
    permissions: {contents: read, packages: read}
    steps:
      - name: Deploy the complete immutable release
        env:
          DEPLOY_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FRONTEND_DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
          API_DIGEST: ${{ needs.image.outputs.api }}
          AUTH_DIGEST: ${{ needs.image.outputs.auth }}
          CORE_DIGEST: ${{ needs.image.outputs.core }}
          ML_DIGEST: ${{ needs.image.outputs.ml }}
          FRONTEND_DIGEST: ${{ needs.image.outputs.frontend }}
        run: |
          set -euo pipefail
          umask 077
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$directory/known_hosts"
          digests=()
          for digest in "$API_DIGEST" "$AUTH_DIGEST" "$CORE_DIGEST" "$ML_DIGEST" "$FRONTEND_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            digests+=("$digest")
          done
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -p 8321 -i "$directory/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$directory/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            saldo-deploy@brokebyte.me "deploy-stack $REVISION ${digests[*]} $REGISTRY_USER"
      - name: Verify public API
        run: curl --fail --silent --show-error --retry 5 https://saldo.brokebyte.me/api/v1/auth/personal-data-consent >/dev/null
