name: Agent questions and discussion

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      github.run_attempt == 1 &&
      (startsWith(github.event.comment.body, '/question') ||
      startsWith(github.event.comment.body, '/discuss'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      requested: ${{ steps.authorize.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/conversation/github_conversation.py authorize

  announce:
    needs: authorize
    if: needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/conversation/github_conversation.py start

  analyze:
    needs: [authorize, announce]
    if: needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: agent-plan-analysis-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      requested: ${{ steps.prepare.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/conversation/github_conversation.py prepare
      - name: Answer through fixed SSH command
        if: steps.prepare.outputs.requested == 'true'
        env:
          AGENT_REVIEW_SSH_KEY: ${{ secrets.AGENT_REVIEW_SSH_KEY }}
          AGENT_REVIEW_KNOWN_HOSTS: ${{ secrets.AGENT_REVIEW_KNOWN_HOSTS }}
        run: python3 .agent/infra/conversation/github_conversation.py invoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: steps.prepare.outputs.requested == 'true'
        with:
          name: conversation-result
          path: conversation-result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [authorize, announce, analyze]
    if: always() && needs.authorize.outputs.requested == 'true' && needs.announce.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-plan-publish-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: download
        if: needs.analyze.result == 'success' && needs.analyze.outputs.requested == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: conversation-result
      - name: Edit the existing reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONVERSATION_JOB_RESULT: ${{ steps.download.outcome == 'failure' && 'failure' || needs.analyze.result }}
          CONVERSATION_REQUESTED: ${{ needs.analyze.outputs.requested }}
        run: python3 .agent/infra/conversation/github_conversation.py publish
