name: Issue scope and fix plans

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      github.run_attempt == 1 &&
      (github.event_name == 'issues' ||
      (!github.event.issue.pull_request && github.event.comment.body == '/create-plan') ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/discuss-plan')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      requested: ${{ steps.authorize.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/planning/github_plan.py authorize

  analyze:
    needs: authorize
    if: needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: agent-plan-analysis-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      requested: ${{ steps.prepare.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/planning/github_plan.py prepare
      - name: Analyze through fixed SSH command
        if: steps.prepare.outputs.requested == 'true'
        env:
          AGENT_REVIEW_SSH_KEY: ${{ secrets.AGENT_REVIEW_SSH_KEY }}
          AGENT_REVIEW_KNOWN_HOSTS: ${{ secrets.AGENT_REVIEW_KNOWN_HOSTS }}
        run: python3 .agent/infra/planning/github_plan.py invoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: steps.prepare.outputs.requested == 'true'
        with:
          name: issue-plan-result
          path: plan-result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: analyze
    if: needs.analyze.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-plan-publish-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node.js 24
        with:
          name: issue-plan-result
      - name: Publish scope or only the fixed plan file
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agent/infra/planning/github_plan.py publish
