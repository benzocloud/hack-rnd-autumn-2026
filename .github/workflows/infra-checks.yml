name: Agent infrastructure checks

on:
  push:
    paths: ['**/*.py', 'ruff.toml', '.agent/infra/**', '.agent/workflows/**', '.github/workflows/**']
  pull_request:
    paths: ['**/*.py', 'ruff.toml', '.agent/infra/**', '.agent/workflows/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  ml-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Run ML baseline unit tests
        run: python3 -B -m unittest discover -s services/ml/tests -p 'test_*.py' -v

  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install pinned Python lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/infra-lint-venv"
          "$RUNNER_TEMP/infra-lint-venv/bin/python" -m pip install -r .agent/infra/requirements-dev.txt
      - name: Lint Python
        run: '"$RUNNER_TEMP/infra-lint-venv/bin/ruff" check --output-format github .'
      - name: Check Python formatting
        run: '"$RUNNER_TEMP/infra-lint-venv/bin/ruff" format --check .'
      - name: Validate infrastructure safety boundaries
        run: python3 -B -m unittest discover -s .agent/infra/tests -p 'test_*.py' -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
