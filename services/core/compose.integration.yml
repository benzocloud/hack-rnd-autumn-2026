name: saldo-core-integration

services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: saldo_core_test
      POSTGRES_USER: core_test
      POSTGRES_PASSWORD: core_test_only
    command: [postgres, -c, saldo.test_database=saldo-core-integration]
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, core_test, -d, saldo_core_test]
      interval: 1s
      timeout: 3s
      retries: 30
