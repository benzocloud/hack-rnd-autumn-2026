name: saldo-onboarding-integration

services:
  authdb:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: saldo_onboarding_auth_test
      POSTGRES_USER: onboarding_test
      POSTGRES_PASSWORD: onboarding_test_only
    command: [postgres, -c, saldo.test_database=saldo-auth-integration]
    ports: ['127.0.0.1::5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, onboarding_test, -d, saldo_onboarding_auth_test]
      interval: 1s
      timeout: 3s
      retries: 30
  coredb:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: saldo_onboarding_core_test
      POSTGRES_USER: onboarding_test
      POSTGRES_PASSWORD: onboarding_test_only
    command: [postgres, -c, saldo.test_database=saldo-core-integration]
    ports: ['127.0.0.1::5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, onboarding_test, -d, saldo_onboarding_core_test]
      interval: 1s
      timeout: 3s
      retries: 30
