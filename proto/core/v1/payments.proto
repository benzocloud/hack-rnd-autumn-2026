syntax = "proto3";

package core.v1;

import "auth/v1/auth.proto";
import "core/v1/common.proto";
import "core/v1/ledger.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/benzocloud/hack-rnd-autumn-2026/services/core/internal/gen/core/v1;corev1";

// Expected movements, not executed transfers. API peer only. Same financial
// read/write authorization as LedgerService; matching cannot execute a payment.
service PaymentsService {
  rpc UpdatePayment(UpdatePaymentRequest) returns (UpdatePaymentResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc RemovePaymentMatch(RemovePaymentMatchRequest) returns (RemovePaymentMatchResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CreateManualPayment(CreateManualPaymentRequest) returns (CreateManualPaymentResponse);
  rpc ListPaymentMatches(ListPaymentMatchesRequest) returns (ListPaymentMatchesResponse);
  rpc MatchPayment(MatchPaymentRequest) returns (MatchPaymentResponse);
  rpc CreateReconciliationGroup(CreateReconciliationGroupRequest) returns (CreateReconciliationGroupResponse);
  rpc GetReconciliationGroup(GetReconciliationGroupRequest) returns (GetReconciliationGroupResponse);
  rpc ListReconciliationGroups(ListReconciliationGroupsRequest) returns (ListReconciliationGroupsResponse);
  rpc RevokeReconciliationGroup(RevokeReconciliationGroupRequest) returns (RevokeReconciliationGroupResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PLANNED = 1;
  PAYMENT_STATUS_PARTIALLY_MATCHED = 2;
  PAYMENT_STATUS_MATCHED = 3;
  PAYMENT_STATUS_CANCELLED = 4;
}
message ExpectedPayment {
  string id = 1;
  string account_id = 2;
  Direction direction = 3;
  Money amount = 4;
  Money remaining_amount = 5;
  string scheduled_date = 6;
  optional string category_id = 7;
  string counterparty_name = 8;
  string description = 9;
  PaymentStatus status = 10;
  RecordSource source = 11;
  int64 version = 12;
  google.protobuf.Timestamp created_at = 13;
  // Absent/invalid/revoked or horizon-incompatible group means unresolved, not
  // an automatically confirmed additional obligation or an empty calendar.
  optional string reconciliation_group_id = 14;
}
message PaymentMatch {
  string id = 1;
  string payment_id = 2;
  string transaction_id = 3;
  Money amount = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListPaymentsRequest {
  auth.v1.BrowserContext context = 1;
  AccountScope scope = 2;
  PageRequest page = 3;
  DateRange dates = 4;
  optional PaymentStatus status = 5;
}
message ListPaymentsResponse {
  repeated ExpectedPayment items = 1;
  PageResponse pagination = 2;
}
message GetPaymentRequest {
  auth.v1.BrowserContext context = 1;
  AccountScope scope = 2;
  string payment_id = 3;
}
message GetPaymentResponse {
  ExpectedPayment payment = 1;
}
message CreateManualPaymentRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string idempotency_key = 3;
  Direction direction = 4;
  Money amount = 5;
  string scheduled_date = 6;
  optional string category_id = 7;
  string counterparty_name = 8;
  string description = 9;
  optional string reconciliation_group_id = 10;
}
message CreateManualPaymentResponse {
  ExpectedPayment payment = 1;
  int64 data_version = 2;
}
message ListPaymentMatchesRequest {
  auth.v1.BrowserContext context = 1;
  AccountScope scope = 2;
  string payment_id = 3;
  PageRequest page = 4;
}
message ListPaymentMatchesResponse {
  repeated PaymentMatch items = 1;
  PageResponse pagination = 2;
}
// Positive amount <= both the remaining expectation and unallocated factual
// amount; same scope/currency/direction. Atomic replay precedes stale guards.
message MatchPaymentRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string idempotency_key = 3;
  string payment_id = 4;
  int64 expected_payment_version = 5;
  string transaction_id = 6;
  int64 expected_transaction_version = 7;
  Money amount = 8;
}
message MatchPaymentResponse {
  PaymentMatch match = 1;
  int64 payment_version = 2;
  int64 data_version = 3;
}

// Patch at least one field. Absent category_change preserves it; explicit clear
// removes it. Existing matches restrict changes to financial economics.
message UpdatePaymentRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string payment_id = 3;
  int64 expected_version = 4;
  optional Direction direction = 5;
  Money amount = 6;
  optional string scheduled_date = 7;
  optional string counterparty_name = 8;
  optional string description = 9;
  oneof category_change {
    string category_id = 10;
    google.protobuf.Empty clear_category = 11;
  }
  // Omission preserves linkage. Clear detaches this payment only; it does not
  // revoke the independently persisted reconciliation group.
  oneof reconciliation_change {
    string reconciliation_group_id = 12;
    google.protobuf.Empty clear_reconciliation_group = 13;
  }
}
message UpdatePaymentResponse {
  ExpectedPayment payment = 1;
  int64 data_version = 2;
}
message CancelPaymentRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string payment_id = 3;
  int64 expected_version = 4;
}
message CancelPaymentResponse {
  ExpectedPayment payment = 1;
  int64 data_version = 2;
}
message RemovePaymentMatchRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string payment_id = 3;
  string match_id = 4;
  int64 expected_payment_version = 5;
}
message RemovePaymentMatchResponse {
  ExpectedPayment payment = 1;
  int64 data_version = 2;
}

enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_ACTIVE = 1;
  RECONCILIATION_STATUS_REVOKED = 2;
}

message HistoricalOperationRef {
  string transaction_id = 1;
  int64 version = 2;
}

message AdditionalObligationConfirmation {
  // Must be true: omission is not an explicit user confirmation.
  bool confirmed = 1;
}

message CompleteReplacement {
  // Nonempty, unique, same-scope references; active groups may not overlap
  // within a snapshot. Versions must match the frozen factual view.
  repeated HistoricalOperationRef historical_operations = 1;
  bool complete_for_horizon = 2;
}

// Independent immutable mapping for one exact cutoff/window. Cancel/full match
// or moving a payment outside the horizon does not revoke this group. A complete
// replacement may have zero future occurrences and still removes historical
// flows from residual inference. Reuse for a new horizon requires new confirmation.
message PaymentReconciliationGroup {
  string id = 1;
  AccountScope scope = 2;
  int64 version = 3;
  ReconciliationStatus status = 4;
  string cutoff_date = 5;
  string horizon_start = 6;
  string horizon_end = 7;
  // Auth-owned actor identity and server timestamp; never client evidence.
  string confirmed_by = 8;
  google.protobuf.Timestamp confirmed_at = 9;
  // Exactly one branch required; additional never excludes historical facts.
  oneof reconciliation {
    AdditionalObligationConfirmation additional = 10;
    CompleteReplacement replacement = 11;
  }
}

// FINANCIAL_WRITE/CSRF. Core generates ID/time/actor and validates the exact
// 30-day window, scoped references/versions and non-overlap under account lock.
// Replay returns the original group/revision before stale-state checks.
message CreateReconciliationGroupRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string idempotency_key = 3;
  string cutoff_date = 4;
  string horizon_start = 5;
  string horizon_end = 6;
  oneof reconciliation {
    AdditionalObligationConfirmation additional = 7;
    CompleteReplacement replacement = 8;
  }
}
message CreateReconciliationGroupResponse {
  PaymentReconciliationGroup group = 1;
  int64 data_version = 2;
}
message GetReconciliationGroupRequest {
  auth.v1.BrowserContext context = 1;
  AccountScope scope = 2;
  string group_id = 3;
}
message GetReconciliationGroupResponse {
  PaymentReconciliationGroup group = 1;
}
message ListReconciliationGroupsRequest {
  auth.v1.BrowserContext context = 1;
  AccountScope scope = 2;
  PageRequest page = 3;
  bool include_revoked = 4;
}
message ListReconciliationGroupsResponse {
  repeated PaymentReconciliationGroup items = 1;
  PageResponse pagination = 2;
}
// FINANCIAL_WRITE/CSRF. Explicit CAS revocation affects future snapshots only;
// it preserves payment/factual history and frozen jobs. Replay does not advance
// data_version twice. No update/un-revoke: changed mapping needs a new group.
message RevokeReconciliationGroupRequest {
  auth.v1.WriteContext context = 1;
  AccountScope scope = 2;
  string group_id = 3;
  int64 expected_version = 4;
  string idempotency_key = 5;
}
message RevokeReconciliationGroupResponse {
  PaymentReconciliationGroup group = 1;
  int64 data_version = 2;
}
