syntax = "proto3";

package ml.v1;

option go_package = "github.com/benzocloud/hack-rnd-autumn-2026/services/core/internal/gen/ml/v1;mlv1";

// Private Core -> ML interface. Core owns authorization, a consistent input
// snapshot, persistence and authoritative balance/risk calculations. Single
// RPC, pinned model version; no implicit baseline fallback (ADR-029).
service ForecastService {
  rpc Predict(PredictRequest) returns (PredictResponse);
}

enum DaySource {
  DAY_SOURCE_UNSPECIFIED = 0;
  DAY_SOURCE_OBSERVED = 1;
  DAY_SOURCE_VERIFIED_NO_OPERATIONS = 2;
  // Financial RPC only: reconstructed from complete covered facts and the
  // observed cutoff EOD. This is not a separate bank balance observation.
  DAY_SOURCE_RECONSTRUCTED_COVERED = 3;
  DAY_SOURCE_PARTIAL = 4;
  DAY_SOURCE_UNAVAILABLE = 5;
}

// ISO dates are company-local business dates, not timestamps. Core must reject
// unresolved gaps/duplicates before constructing these consecutive daily points.
message HistoricalDay {
  string date = 1;
  optional int64 inflow_minor = 2;
  optional int64 outflow_minor = 3;
  optional int64 closing_balance_minor = 4;
  DaySource source = 5;
  repeated string quality_codes = 6;
}

message ModelContext {
  string model_name = 1;
  string model_version = 2;
  string preprocessing_version = 3;
  string configuration_id = 4;
  optional string random_seed = 5;
  optional uint32 trajectory_count = 6;
}

// Reserved input for explicit rejection until calendar reconciliation is agreed.
// A full history-only baseline must not be blindly added to known payments.
message KnownPayment {
  string payment_id = 1;
  string date = 2;
  int64 inflow_minor = 3;
  int64 outflow_minor = 4;
}

message ForecastSnapshot {
  string snapshot_id = 1;
  string company_id = 2;
  string account_id = 3;
  uint64 data_version = 4;
  string currency = 5;
  string cutoff_date = 6;
  optional int64 initial_balance_minor = 7;
  repeated HistoricalDay history = 8;
  repeated KnownPayment known_payments = 9;
}

message PredictRequest {
  ForecastSnapshot snapshot = 1;
  uint32 horizon_days = 2;
  ModelContext model = 3;
  repeated FinancialOperation operations = 4;
  FinancialCalendar calendar = 5;
  repeated string availability_limitations = 6;
}

message ForecastDay {
  string date = 1;
  int64 inflow_minor = 2;
  int64 outflow_minor = 3;
  // Mathematical reference only. Core independently checks the identity and
  // owns the final financial result; this is not a database balance observation.
  int64 reference_balance_minor = 4;
  optional int64 balance_lower_minor = 5;
  optional int64 balance_upper_minor = 6;
  FinancialProbability negative_balance_probability = 7;
}

message PredictResponse {
  string snapshot_id = 1;
  string company_id = 2;
  string account_id = 3;
  uint64 data_version = 4;
  ModelContext model = 5;
  string currency = 6;
  string cutoff_date = 7;
  string start_date = 8;
  repeated ForecastDay days = 9;
  // below_zero_eod, not proven insolvency. Absence means no negative reference
  // balance in the horizon; no calibrated probability is available.
  optional string first_negative_balance_date = 10;
  // History-only baseline already contains past recurring AND one-off flows;
  // true does not mean only recurring flows or certify future obligations.
  bool history_only_includes_recurring_flows = 11;
  repeated string warnings = 12;
  repeated ForecastComponent components = 13;
  FinancialProbability gap_probability = 14;
  repeated string assumptions = 15;
  ForecastUncertainty uncertainty = 16;
  string calendar_snapshot_id = 17;
  uint64 calendar_data_version = 18;
  repeated string replaced_historical_operation_ids = 19;
  repeated FinancialOperation classified_operations = 20;
  repeated string availability_limitations = 21;
  repeated HistoryGroupEvidence history_evidence = 22;
}

// Caller-owned immutable facts. At most one direction is positive. Categories
// and regularity keys are retained as metadata; they are not gap probabilities.
message FinancialOperation {
  string operation_id = 1;
  string date = 2;
  int64 inflow_minor = 3;
  int64 outflow_minor = 4;
  string category_code = 5;
  string category_source = 6;
  string regularity_key = 7;
  uint64 version = 8;
  optional string category_id = 9;
  optional string category_company_id = 10;
  string counterparty_inn = 11;
  string counterparty_name = 12;
  string payment_purpose = 13;
  string factual_source_kind = 14;
  string source_namespace = 15;
  string external_operation_id = 16;
}

// Full schedule for one explicitly identified component over this horizon.
// Core must certify completeness; ML cannot infer it from a missing payment.
message CalendarGroup {
  string group_id = 1;
  repeated string historical_operation_ids = 2;
  bool complete_for_horizon = 3;
  bool additional_obligation_confirmed = 4;
}

message ScheduledPayment {
  string payment_id = 1;
  uint64 version = 2;
  string effective_date = 3;
  string original_due_date = 4;
  int64 remaining_inflow_minor = 5;
  int64 remaining_outflow_minor = 6;
  string category_code = 7;
  string group_id = 8;
  string source = 9;
  string regularity_key = 10;
  optional string category_id = 11;
  optional string category_company_id = 12;
}

message FinancialCalendar {
  string snapshot_id = 1;
  uint64 data_version = 2;
  // Availability date, not the dates of the scheduled future payments.
  // Empty for UNAVAILABLE: never invent a historical knowledge date.
  string as_of_business_date = 3;
  repeated CalendarGroup groups = 4;
  repeated ScheduledPayment payments = 5;
  CalendarKnowledgeMode knowledge_mode = 6;
  // Required for CURRENT knowledge on cutoff+1. Core attests that no account
  // movement occurred since the accepted cutoff EOD in the same covered view.
  // Otherwise remaining/status may omit a payment settled after that EOD;
  // advance the accepted cutoff or use a separately agreed intraday bridge.
  bool no_post_cutoff_movements = 7;
}

enum CalendarKnowledgeMode {
  CALENDAR_KNOWLEDGE_MODE_UNSPECIFIED = 0;
  CALENDAR_KNOWLEDGE_MODE_CURRENT = 1;
  CALENDAR_KNOWLEDGE_MODE_HISTORICAL_AS_OF_CERTIFIED = 2;
  // History-only fallback. No groups/payments/as_of_business_date are allowed.
  // Caller preserves historical_calendar_unavailable in availability_limitations.
  // snapshot_id/data_version identify the facts whose calendar is unavailable.
  CALENDAR_KNOWLEDGE_MODE_UNAVAILABLE = 3;
}

message ForecastComponent {
  string component_id = 1;
  string date = 2;
  string category_code = 3;
  int64 inflow_minor = 4;
  int64 outflow_minor = 5;
  string kind = 6;
  repeated string source_ids = 7;
  string regularity_key = 8;
  optional string category_id = 9;
  optional string category_company_id = 10;
}

message EmpiricalBalanceBand {
  string date = 1;
  int64 lower_minor = 2;
  int64 upper_minor = 3;
}

message HistoryGroupEvidence {
  string evidence_id = 1;
  repeated string historical_operation_ids = 2;
  string category_source = 3;
}

message ForecastUncertainty {
  string method = 1;
  uint32 scenarios = 2;
  uint32 block_days = 3;
  uint64 seed = 4;
  double lower_quantile = 5;
  double upper_quantile = 6;
  bool calibrated = 7;
  string gap_probability_unavailable_reason = 8;
  repeated EmpiricalBalanceBand bands = 9;
  repeated string assumptions = 10;
}

// An estimate requires calibration provenance. Rule confidence never qualifies.
// A model without an estimate returns unavailable_reason, never value=0.
message CalibratedEstimate {
  double value = 1;
  string calibration_version = 2;
  string evaluation_reference = 3;
}
message FinancialProbability {
  oneof estimate {
    CalibratedEstimate calibrated = 1;
    string unavailable_reason = 2;
  }
}
