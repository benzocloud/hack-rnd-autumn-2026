    post:
      operationId: createScenario
      summary: Create immutable stress or stress-plus-action run
      tags:
      - Scenarios
      description: Four typed stress transforms; explicit full conditions and optional one-level response-action. Parent stress is never lost. Versioned source economic occurrence checks prevent double count. Persist Scenario+snapshot reference+pinned context+new forecast+job coherently before 202. Facts/real calendar unchanged; missing advertised model capability 409 SCENARIO_UNAVAILABLE. Do not silently retrain/rebase. Named examples are alternative illustrative inputs, not real stored records or a claim that every example base has all capabilities. Obtain eligible component/occurrence IDs from the selected successful base and respect its scenario_capabilities; do not fabricate IDs in frontend. Parent sc_123 in stress_plus_response denotes the saved delay_receipt example with identical conditions. For a response request send only name, comparison_parent_scenario_id and response_action; server inherits base+all stress conditions and resolves effective_occurrence_id from the successful parent result.
