components:
  securitySchemes:
    cookieSession:
      type: "apiKey"
      in: "cookie"
      name: "__Host-cashflow_session"
      description: "Opaque server-side session cookie; Secure, HttpOnly, SameSite=Lax, Path=/. Only same-origin browser traffic in this baseline. CSRF header is additionally required on all writes."
  parameters:
    company_id:
      name: "company_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "cmp_123"
      description: "Internal tenant ID. Every company/resource relationship and live membership is checked server-side; unknown or inaccessible resource returns 404."
    limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        examples:
          - 50
        minimum: 1
        maximum: 100
      description: "Default 50, maximum 100."
    cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
        maxLength: 1024
        examples:
          - "opaque-next-page-cursor"
      description: "Opaque continuation token bound to filters, tenant and sort. Do not construct in browser; invalid cursor gives 400."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
        examples:
          - "example-request-key-123"
      description: "Required for create/job/commit operations. Bound to actor, tenant (if any), method, path and canonical semantic payload plus file-byte digest. Same key+same payload reuses original resource without re-running job; different payload gives 409 IDEMPOTENCY_CONFLICT. Store result/key at least 24h; reuse original resource. Replays may return original acceptance envelope/code even when job is now terminal; queued in that envelope describes initial acceptance, GET status_url is current state. Never enqueue again under same key."
    Csrf:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 16
        examples:
          - "example-csrf-token-1234567890"
      description: "Synchronizer token from GET /auth/csrf; required for every state-changing call, including registration/login/recovery/logout. Bound to same cookie session; missing/invalid returns 403 CSRF_INVALID. Server also validates same-origin Origin (or same-origin Referer fallback) and rejects cross-site writes."
    from:
      name: "from"
      in: "query"
      schema:
        type: "string"
        format: "date"
        examples:
          - "2026-10-23"
      description: "Inclusive ISO date; from<=to."
    to:
      name: "to"
      in: "query"
      schema:
        type: "string"
        format: "date"
        examples:
          - "2026-10-23"
      description: "Inclusive ISO date; from<=to."
    user_id:
      name: "user_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "usr_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    invitation_id:
      name: "invitation_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "inv_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    transaction_id:
      name: "transaction_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "txn_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    import_id:
      name: "import_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "imp_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    connection_id:
      name: "connection_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "con_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    payment_id:
      name: "payment_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "pay_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    match_id:
      name: "match_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "match_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    forecast_id:
      name: "forecast_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "fc_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
    scenario_id:
      name: "scenario_id"
      in: "path"
      required: true
      schema:
        type: "string"
        minLength: 1
        maxLength: 128
        examples:
          - "sc_123"
      description: "Opaque ID belonging to the path company; incoming invitation IDs instead belong to current verified recipient."
  responses:
    Error400:
      description: "Malformed request"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "INVALID_REQUEST"
              message: "Malformed request"
              field_errors: []
              request_id: "req_123"
    Error401:
      description: "Missing or expired session"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "UNAUTHENTICATED"
              message: "Missing or expired session"
              field_errors: []
              request_id: "req_123"
