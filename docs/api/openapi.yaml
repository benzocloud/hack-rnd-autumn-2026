    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - acc_123
        company_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - cmp_123
        name:
          type: string
          examples:
          - Основной счёт
        currency:
          type: string
          enum:
          - RUB
          examples:
          - RUB
          description: Provisional MVP convention, not a fact established by dataset. All current requests must use RUB; another currency is rejected without conversion.
        balance:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        balance_as_of:
          type:
          - string
          - 'null'
          format: date
          examples:
          - '2026-10-23'
        balance_source:
          type:
          - string
          - 'null'
          enum:
          - statement_eod
          - manual
          - null
          examples:
          - statement_eod
        data_version:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Opaque decimal integer version encoded as a string. Compare for equality; do not increment in the browser.
          examples:
          - '42'
        transaction_source:
          anyOf:
          - $ref: '#/components/schemas/TransactionSourceBinding'
          - type: 'null'
      required:
      - id
      - company_id
      - name
      - currency
      - balance
      - balance_as_of
      - balance_source
      - data_version
      - transaction_source
      description: One default account per company in MVP; no multi-account management. Balance is the latest accepted dated observation, not a live bank balance. Missing balance and date are both null. transaction_source is the only allowed transaction-history namespace. Other connections may explicitly import planned_payments only. Source changes and manual/external history mixing are blocked with 409 FACTUAL_SOURCE_CONFLICT; scoped duplicate detection alone is not cross-source reconciliation. A separately recorded manual EOD anchor is allowed on a date without a statement observation and retains its manual provenance; it never changes transaction_source.
    SetBalanceRequest:
      type: object
      additionalProperties: false
      properties:
        balance:
          $ref: '#/components/schemas/Money'
        as_of:
          type: string
          format: date
          examples:
          - '2026-10-23'
        expected_data_version:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Opaque decimal integer version encoded as a string. Compare for equality; do not increment in the browser.
          examples:
          - '42'
        note:
          type: string
          minLength: 1
          maxLength: 500
          examples:
          - Начальный остаток по данным владельца
      required:
      - balance
      - as_of
      - expected_data_version
      - note
      description: Owner/financier supplies an explicit dated EOD balance for manual onboarding or a later unobserved cutoff, not a fabricated transaction or a source-reconciliation operation. This observation does not bind/change transaction_source and is permitted after external history import on an unobserved date. An existing statement observation on the SAME day conflicts (409); never overwrite it. Preserve source=manual, note and audit/quality provenance. Changes financial data version; date cannot be in the future in company timezone.
