      - end_date
      - horizon_days
      - currency
      - account_id
      - opening_balance
      - balance_as_of
      - risk_definition
      - model_context
      description: Immutable snapshot. Historical mode excludes facts and derived features after cutoff_date. start_date must equal cutoff_date+1 calendar day; data_as_of is latest usable factual coverage; balance_as_of must equal cutoff_date. opening_balance is a dated accepted EOD observation at cutoff, never a silent carry-forward of an earlier balance. Missing cutoff EOD causes BALANCE_AS_OF_UNAVAILABLE; no assumption of zero unobserved cashflow. A new explicit manual dated balance on an unobserved date may supply an onboarding/later-cutoff anchor with its provenance/quality warning, without changing the transaction-history source binding; a same-date statement observation cannot be overwritten. Known future payments in backtests require point-in-time availability; dataset has no such labels. below_zero_eod is a transparent negative-EOD-balance proxy, not a verified unpaid-obligation metric or credit-limit-aware insolvency prediction. Horizon counts calendar days, timezone company Europe/Moscow.
