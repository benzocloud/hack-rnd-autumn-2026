      - comparison_parent_scenario_id
      - forecast_id
      - changes
      - response_action
      - out_of_horizon_occurrence_ids
      - created_at
      description: Immutable saved scenario. Poll forecast_id for status/result. This record is not updated when live history changes; associated forecasts expose is_stale. Out-of-horizon moves keep the economic occurrence alive. For response-action scenarios, base_forecast_id and the complete ordered changes are inherited and persisted by the server from comparison_parent_scenario_id; they are returned for audit, never resubmitted by the client.
