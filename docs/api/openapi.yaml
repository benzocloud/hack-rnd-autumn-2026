    TransactionSourceBinding:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - manual
          - external
        source_system:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - dataset_v1
        source_company_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
      required:
      - mode
      - source_system
      - source_company_id
      description: Single authoritative transaction-history namespace for the default account in MVP. Null Account.transaction_source means no transaction source is bound. First committed external import containing transactions or external balance_observations binds mode=external and (source_system,source_company_id) atomically with all records; first manual transaction binds mode=manual, source_system=manual_v1, source_company_id=null. A manual dated balance alone does not bind or change this authority. No source switch, merge or cross-source reconciliation endpoint exists in this baseline.
      oneOf:
      - properties:
          mode:
            const: manual
          source_system:
            const: manual_v1
          source_company_id:
            type: 'null'
      - properties:
          mode:
            const: external
          source_company_id:
            type: string
            minLength: 1
    ImportRecordKinds:
      type: array
      items:
        type: string
        enum:
        - transactions
        - planned_payments
        - balance_observations
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: Explicit normalized record kinds requested from the adapter, a nonempty subset of provider.capabilities. Unselected kinds are not fetched/imported and selected kinds are never silently discarded. transactions or external balance_observations require the canonical account source; planned_payments-only imports may use an additional provider namespace. Dataset uploads always use transactions and balance_observations.
    EffectiveOccurrenceTarget:
      type: object
      additionalProperties: false
      properties:
        effective_occurrence_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - eff_receipt_delayed
      required:
      - effective_occurrence_id
      description: Exact piece ID returned by the successful immutable direct parent stress forecast result.effective_occurrences. Parent scenario is selected by the request; server derives component/occurrence IDs, date and remaining amount. Client must not retransmit source_date or calculate stress transforms.
    EffectiveOccurrence:
      type: object
      additionalProperties: false
      properties:
        effective_occurrence_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - eff_receipt_delayed
        component_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - component_123
        occurrence_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - occurrence_123
        payment_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        direction:
          type: string
          enum:
          - inflow
          - outflow
        date:
          type: string
          format: date
        remaining_amount:
          $ref: '#/components/schemas/NonnegativeMoney'
        in_horizon:
          type: boolean
        response_action_eligible:
          type: boolean
      required:
      - effective_occurrence_id
      - component_id
      - occurrence_id
      - payment_id
      - direction
      - date
      - remaining_amount
      - in_horizon
      - response_action_eligible
      description: 'Server-computed effective outstanding slice of one immutable base ForecastComponent after all saved stress transforms and any saved response action. Original component/occurrence IDs remain unchanged for traceability; effective_occurrence_id uniquely identifies a split portion within this immutable result and is stable on repeated reads. Partial delays expose both the original-date remainder and delayed portion, including dates outside the horizon. Zero-reduced portions remain present with amount 0 and response_action_eligible=false. in_horizon is only display/coverage information: an outstanding known payment moved outside the horizon may remain eligible to move back inside. Response actions require a known-payment occurrence with a nonnull payment_id, a positive remaining amount and server eligibility; modeled sales, facts and newly added hypothetical one-off expenses are never response-payment targets. Effective amounts/dates are computed only by Core; browser does not reproduce transformation arithmetic.'
      allOf:
      - if:
          properties:
            remaining_amount:
              properties:
                amount_minor:
                  const: '0'
              required:
              - amount_minor
          required:
          - remaining_amount
        then:
          properties:
            response_action_eligible:
              const: false
      - if:
          properties:
            payment_id:
              type: 'null'
          required:
          - payment_id
        then:
          properties:
            response_action_eligible:
              const: false
      examples:
      - effective_occurrence_id: eff_receipt_remainder
        component_id: component_123
        occurrence_id: occurrence_123
        payment_id: pay_receipt
        direction: inflow
        date: '2026-10-21'
        remaining_amount:
          amount_minor: '4000'
          currency: RUB
        in_horizon: true
        response_action_eligible: true
      - effective_occurrence_id: eff_receipt_delayed
        component_id: component_123
        occurrence_id: occurrence_123
        payment_id: pay_receipt
        direction: inflow
        date: '2026-11-13'
        remaining_amount:
          amount_minor: '6000'
          currency: RUB
        in_horizon: false
        response_action_eligible: true
      - effective_occurrence_id: eff_sales_zero
        component_id: component_sales
        occurrence_id: occurrence_sales
        payment_id: null
        direction: inflow
        date: '2026-10-21'
        remaining_amount:
          amount_minor: '0'
          currency: RUB
        in_horizon: true
        response_action_eligible: false
    IndependentScenarioRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          examples:
          - Клиент задержит оплату
        base_forecast_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - fc_123
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioChange'
          minItems: 1
          maxItems: 16
      required:
      - name
      - base_forecast_id
      - changes
      description: Independent stress of a successful nonscenario base forecast. Explicit nonoverlapping transforms only; same base snapshot/horizon/currency/risk/model context and seeded trajectories, no implicit rebase. Client does not send parent/action keys, including null placeholders. Server validates capabilities and saves the full immutable conditions.
    ResponseScenarioRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          examples:
          - Клиент задержит оплату
        comparison_parent_scenario_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - sc_123
        response_action:
          $ref: '#/components/schemas/ResponseAction'
      required:
      - name
      - comparison_parent_scenario_id
      - response_action
      description: Response to a successful DIRECT independent stress scenario. Server derives base_forecast_id and inherits the complete immutable changes in their saved order, then applies this action to the parent result. Client must not send base_forecast_id, changes or source_date. Parent and resulting forecast keep exactly the same snapshot/horizon/currency/risk/model context and seeded trajectories. Reject unavailable parent or deeper nesting with 409; server stores full inherited conditions in returned Scenario, never merely the delta.
