openapi: "3.1.0"
info:
  title: "Cash Flow Frontend → Go API"
  version: "0.1.0"
  description: "Review baseline, 2026-10-23. A saved REST proposal, not implemented endpoints, accepted ADR, or evidence of a working integration. Browser calls Go API only; Core/ML protobuf boundaries remain separate. Paths are relative to /api/v1.\n\nScope: self-service small-business account, one default account per company, owner/financier company roles, file/manual input, explicitly mocked external adapters, forecasts, four what-if templates, plan-fact. RUB-only is a provisional adapter/MVP convention: dataset contains no currency. Email/password, cookie session, seven-day invitations, numerical input/upload caps and below_zero_eod proxy are proposed defaults requiring owner review. Actual FNS/1C DTO research immediately follows owner approval of this saved REST baseline; mock schemas are NOT claims about their official APIs.\n\nSecurity: same-origin deployment only in this baseline. Secure HttpOnly SameSite=Lax __Host- cookie, server session, synchronizer CSRF on ALL writes including public login/register/recovery. GET /auth/csrf establishes pre-auth context; send credentials and X-CSRF-Token thereafter. Exact trusted Origin/Referer validation; no wildcard credentialed CORS. Rotate session after login and obtain fresh CSRF token. API must not expose Auth/Core databases or trust role/company/source IDs sent by browser. Auth unavailable: fail closed. Company membership is checked live on every scoped read/write, including polling/downloads; financial operations owner/financier, administration owner only. Cross-tenant resources return 404. Email verification required for company operations. Auth tokens/passwords/financial contents never logged; errors include request_id, not stack traces.\n\nConsistency: IDs opaque, all money exact decimal integer strings in minor units. Positive movement plus direction differs from signed balance. Date-only business dates use Europe/Moscow, timestamp strings UTC Z. Do not use JS floating point for financial arithmetic. All lists cursor-based with stable sort (by resource date then ID unless documented); cursors bind filters and tenant. Financial data version increments on facts, dated balances, categories, known payments, matches and imported facts; connections/invitation cosmetics do not mutate prediction snapshots. Reads include dated provenance/freshness; no balance claims live bank access.\n\nJob semantics: HTTP 202 only after durable input/job saved. Retried idempotent create/job requests reuse resource; same key different semantic payload/file bytes is 409. Stored resource is truth; transport errors never mean job failure. Imports first preview, then explicit atomic commit with optimistic versions. No silent partial rows, inferred tenant access, duplicate economic counting or invented balancing transactions. Identical external IDs dedup only inside scoped source; content-similar different IDs warn. Historical forecasts filter all factual/features past cutoff and preserve point-in-time known obligations. A negative balance is an EOD indicator; overdraft limit and actual unpaid obligation are unknown.\n\nAll application responses, including errors, should use Cache-Control:no-store; JSON content type application/json. No merge/deploy or implemented behavior is implied by this file. Delivery infrastructure, provider DTO mapping and calibrated ML uncertainty remain separate reviewed work."
servers:
  -
    url: "/api/v1"
    description: "Same-origin Go API; no production host assumed."
security:
  -
    cookieSession: []
tags:
  -
    name: "Auth"
  -
    name: "Account"
  -
    name: "Companies"
  -
    name: "Members"
  -
    name: "Ledger"
  -
    name: "Imports"
  -
    name: "Integrations"
  -
    name: "Payments"
  -
    name: "Forecasts"
  -
    name: "Scenarios"
paths:
  "/auth/csrf":
    get:
      operationId: "getCsrfToken"
      summary: "Get a pre-authenticated or session CSRF token"
      tags:
        - "Auth"
      description: "Same-origin browser call with credentials. Sets/uses pre-auth or authenticated cookie and returns synchronizer token. Cache-Control:no-store. Cross-origin callers cannot read token; no wildcard credentialed CORS."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessCsrfTokenCookie"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
  "/auth/register":
    post:
      operationId: "register"
      summary: "Register a personal account"
      tags:
        - "Auth"
      description: "Creates account pending contact verification; sends a one-time confirmation link through configured delivery. Generic response for an existing address; no company or bank connection is created. Password is never logged. Rate limit by IP+normalized email; no mock claim that mail was delivered."
      responses:
        "202":
          "$ref": "#/components/responses/SuccessAcknowledgement"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            examples:
              sample:
                "$ref": "#/components/examples/RegisterRequest"
  "/auth/login":
    post:
      operationId: "login"
      summary: "Sign in"
      tags:
        - "Auth"
      description: "Email/password; generic credentials error. Rotates session and invalidates pre-auth CSRF token. Unverified account may log in to verify/logout/me, but company and financial endpoints require verified email. GET /auth/csrf again after successful login."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessSessionCookie"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            examples:
              sample:
                "$ref": "#/components/examples/LoginRequest"
  "/auth/verify-email":
    post:
      operationId: "verifyEmail"
      summary: "Confirm email using one-time token"
      tags:
        - "Auth"
      description: "Token is bound to account+purpose, short-lived, single-use. No company is created and no financial permissions granted. Invalid/expired token gives 422 TOKEN_INVALID_OR_EXPIRED; reusing a consumed token cannot verify another account."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessAcknowledgement"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TokenRequest"
            examples:
              sample:
                "$ref": "#/components/examples/TokenRequest"
  "/auth/resend-verification":
    post:
      operationId: "resendVerification"
      summary: "Request a new confirmation email"
      tags:
        - "Auth"
      description: "Generic acknowledgement; rate limited, does not enumerate accounts. Previous confirmation tokens invalidated."
      responses:
        "202":
          "$ref": "#/components/responses/SuccessAcknowledgement"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EmailRequest"
            examples:
              sample:
                "$ref": "#/components/examples/EmailRequest"
  "/auth/forgot-password":
    post:
      operationId: "forgotPassword"
      summary: "Request password recovery"
      tags:
        - "Auth"
      description: "Generic response for unknown/known email. Rate-limited single-use purpose-bound token sent by configured delivery, not exposed in JSON."
      responses:
        "202":
          "$ref": "#/components/responses/SuccessAcknowledgement"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/EmailRequest"
            examples:
              sample:
                "$ref": "#/components/examples/EmailRequest"
  "/auth/reset-password":
    post:
      operationId: "resetPassword"
      summary: "Set password using recovery token"
      tags:
        - "Auth"
      description: "Consumes token atomically, revokes all existing sessions, does not automatically sign in. Invalid/expired token gives 422 TOKEN_INVALID_OR_EXPIRED. Obtain fresh pre-auth CSRF token before next login."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessAcknowledgement"
        "400":
          "$ref": "#/components/responses/Error400"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
            examples:
              sample:
                "$ref": "#/components/examples/ResetPasswordRequest"
  "/auth/logout":
    post:
      operationId: "logout"
      summary: "End current browser session"
      tags:
        - "Auth"
      description: "Invalidates current session and expires cookie; idempotent for already logged-out session with valid pre-auth CSRF. Other sessions unchanged. Get new CSRF token before later login."
      responses:
        "204":
          description: "Completed; no body."
          headers:
            Set-Cookie:
              description: "Expire session cookie."
              schema:
                type: "string"
                example: "__Host-cashflow_session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      security: []
  "/me":
    get:
      operationId: "getMe"
      summary: "Get current personal account"
      tags:
        - "Account"
      description: "No active company required; also usable by unverified logged-in account. Company access remains subject to verified email and live membership."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessUser"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
  "/companies":
    get:
      operationId: "listCompanies"
      summary: "List accessible companies"
      tags:
        - "Companies"
      description: "Verified account; returns only live memberships. No selected company required."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessCompanyList"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/limit"
        -
          "$ref": "#/components/parameters/cursor"
    post:
      operationId: "createCompany"
      summary: "Create company and default account"
      tags:
        - "Companies"
      description: "Verified account. Atomically coherent business result across Auth/Core boundaries before 201; partial state must remain inaccessible and retry-recoverable. Same key retries never create two companies. No assumption of distributed SQL transaction."
      responses:
        "201":
          "$ref": "#/components/responses/SuccessCompany"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateCompanyRequest"
            examples:
              sample:
                "$ref": "#/components/examples/CreateCompanyRequest"
  "/companies/{company_id}":
    parameters:
      -
        "$ref": "#/components/parameters/company_id"
    get:
      operationId: "getCompany"
      summary: "Get company workspace"
      tags:
        - "Companies"
      description: ""
      responses:
        "200":
          "$ref": "#/components/responses/SuccessCompany"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
    patch:
      operationId: "updateCompany"
      summary: "Update company display details"
      tags:
        - "Companies"
      description: "Owner only; live server-side permission check. Version conflict 409; no ownership transfer or currency mutation."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessCompany"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateCompanyRequest"
            examples:
              sample:
                "$ref": "#/components/examples/UpdateCompanyRequest"
  "/companies/{company_id}/members":
    parameters:
      -
        "$ref": "#/components/parameters/company_id"
    get:
      operationId: "listMembers"
      summary: "List company members"
      tags:
        - "Members"
      description: "Owner only; live server-side permission check. "
      responses:
        "200":
          "$ref": "#/components/responses/SuccessMembershipList"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/limit"
        -
          "$ref": "#/components/parameters/cursor"
  "/companies/{company_id}/members/{user_id}":
    parameters:
      -
        "$ref": "#/components/parameters/company_id"
      -
        "$ref": "#/components/parameters/user_id"
    delete:
      operationId: "removeMember"
      summary: "Revoke financier access"
      tags:
        - "Members"
      description: "Owner only; live server-side permission check. Only financier membership can be removed. Company owner cannot be removed or left absent. Idempotent removal for already removed scoped user. Access to future reads/writes is revoked immediately; already accepted jobs may finish under service identity but revoked user cannot read result. Account/history/forecasts are retained."
      responses:
        "204":
          description: "Completed; no body."
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
  "/companies/{company_id}/invitations":
    parameters:
      -
        "$ref": "#/components/parameters/company_id"
    get:
      operationId: "listCompanyInvitations"
      summary: "List company invitations"
      tags:
        - "Members"
      description: "Owner only; live server-side permission check. "
      responses:
        "200":
          "$ref": "#/components/responses/SuccessInvitationList"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/limit"
        -
          "$ref": "#/components/parameters/cursor"
    post:
      operationId: "createInvitation"
      summary: "Invite a registered financier"
      tags:
        - "Members"
      description: "Owner only; live server-side permission check. Existing pending invite for same company+email reused; no duplicate membership. Generic 422 INVITATION_NOT_AVAILABLE for ineligible recipient. Expiry provisionally seven days, explicit acceptance mandatory."
      responses:
        "201":
          "$ref": "#/components/responses/SuccessInvitation"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateInvitationRequest"
            examples:
              sample:
                "$ref": "#/components/examples/CreateInvitationRequest"
  "/companies/{company_id}/invitations/{invitation_id}":
    parameters:
      -
        "$ref": "#/components/parameters/company_id"
      -
        "$ref": "#/components/parameters/invitation_id"
    delete:
      operationId: "revokeInvitation"
      summary: "Revoke a pending invitation"
      tags:
        - "Members"
      description: "Owner only; live server-side permission check. Pending→revoked; repeated revoke is safe. Accepted invitation cannot be revoked to remove member: use member deletion. Expired/declined invitations remain history."
      responses:
        "204":
          description: "Completed; no body."
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
  "/me/invitations":
    get:
      operationId: "listMyInvitations"
      summary: "List invitations to current account"
      tags:
        - "Members"
      description: "Verified registered recipient only; no selected company necessary and no access to company financials before acceptance."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessInvitationList"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/limit"
        -
          "$ref": "#/components/parameters/cursor"
  "/me/invitations/{invitation_id}/accept":
    parameters:
      -
        "$ref": "#/components/parameters/invitation_id"
    post:
      operationId: "acceptInvitation"
      summary: "Accept invitation"
      tags:
        - "Members"
      description: "Verified recipient must match invited registered account; validates current pending state/version/expiry. Acceptance and membership coherence recoverable on retry. Already accepted by same user returns same Company; revoked/expired/declined returns 409."
      responses:
        "200":
          "$ref": "#/components/responses/SuccessCompany"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "503":
          "$ref": "#/components/responses/Error503"
      parameters:
        -
          "$ref": "#/components/parameters/Csrf"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/VersionRequest"
            examples:
