  schemas:
    Money:
      type: "object"
      additionalProperties: false
      properties:
        amount_minor:
          type: "string"
          pattern: "^-?(?:0|[1-9][0-9]*)$"
          description: "Exact signed integer minor units encoded as decimal text; no exponent or decimal point. RUB has 100 minor units."
          examples:
            - "5000000"
        currency:
          type: "string"
          enum:
            - "RUB"
          examples:
            - "RUB"
          description: "Provisional MVP convention, not a fact established by dataset. All current requests must use RUB; another currency is rejected without conversion."
      required:
        - "amount_minor"
        - "currency"
      description: "Signed amount, used for balances and deltas. Negative balance may be overdraft; not proof that a bank payment was rejected."
    PositiveMoney:
      type: "object"
      additionalProperties: false
      properties:
        amount_minor:
          type: "string"
          pattern: "^[1-9][0-9]*$"
          description: "Strictly positive integer minor units encoded as decimal text."
          examples:
            - "1000000"
        currency:
          type: "string"
          enum:
            - "RUB"
          examples:
            - "RUB"
          description: "Provisional MVP convention, not a fact established by dataset. All current requests must use RUB; another currency is rejected without conversion."
      required:
        - "amount_minor"
        - "currency"
      description: "Strictly positive movement amount; direction is a separate field."
    NonnegativeMoney:
      type: "object"
      additionalProperties: false
      properties:
        amount_minor:
          type: "string"
          pattern: "^(?:0|[1-9][0-9]*)$"
          examples:
            - "0"
        currency:
          type: "string"
          enum:
            - "RUB"
          examples:
            - "RUB"
          description: "Provisional MVP convention, not a fact established by dataset. All current requests must use RUB; another currency is rejected without conversion."
      required:
        - "amount_minor"
        - "currency"
    FieldError:
      type: "object"
      additionalProperties: false
      properties:
        field:
          type: "string"
          examples:
            - "scheduled_date"
        code:
          type: "string"
          examples:
            - "INVALID_DATE"
        message:
          type: "string"
          examples:
            - "Укажите корректную дату"
      required:
        - "field"
        - "code"
        - "message"
    ErrorDetail:
      type: "object"
      additionalProperties: false
      properties:
        code:
          type: "string"
          examples:
            - "VALIDATION_ERROR"
        message:
          type: "string"
          examples:
            - "Проверьте параметры запроса"
        field_errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/FieldError"
        request_id:
          type: "string"
          minLength: 1
          maxLength: 128
          examples:
            - "req_123"
      required:
        - "code"
        - "message"
        - "field_errors"
        - "request_id"
    Error:
      type: "object"
      additionalProperties: false
      properties:
        error:
          "$ref": "#/components/schemas/ErrorDetail"
      required:
        - "error"
    Acknowledgement:
      type: "object"
      additionalProperties: false
      properties:
        message:
          type: "string"
          examples:
            - "Если адрес зарегистрирован, инструкции будут отправлены."
      required:
        - "message"
      description: "Generic acknowledgement avoids account enumeration; does not claim that an email was delivered."
    User:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          minLength: 1
          maxLength: 128
          examples:
            - "usr_123"
        email:
          type: "string"
          format: "email"
          maxLength: 254
          examples:
