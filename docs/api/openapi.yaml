        source_company_id:
          type: string
          minLength: 1
          maxLength: 128
          examples:
          - C001
        connection_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          examples:
          - con_123
        status:
          type: string
          enum:
          - queued
          - processing
          - preview_ready
          - applied
