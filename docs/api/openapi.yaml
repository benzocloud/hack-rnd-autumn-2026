      - feasibility_condition
      description: Optional hypothetical response on exactly one eligible still-outstanding known-payment slice returned in the direct parent stress result.effective_occurrences. Target effective_occurrence_id selects its current server-computed date/remaining amount, including a previously delayed partial receipt or expense. Server checks membership in this exact successful immutable parent result, response_action_eligible=true and 0<amount<=remaining_amount. Reject zero/unavailable/already-allocated/model-only/factual pieces with 422 INVALID_RESPONSE_TARGET; outside-horizon slices are allowed if still eligible. new_date must differ from the effective date and cannot precede input.start_date. Apply only after all inherited stress transforms, move selected amount exactly once, conserve its total and leave remainder at the effective source date. Never changes Ledger/Payments or removes parent stress assumptions. Deeper response nesting is rejected.
