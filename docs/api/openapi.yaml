      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: uploadImport
      summary: Upload CSV for asynchronous validation
      tags:
      - Imports
      description: 'dataset_v1 only: UTF-8 BOM tolerated/expected, semicolon separator, ISO dates, decimal ruble amounts with dot. Required columns: company_id,operation_id,operation_date,amount,direction,counterparty_inn,counterparty_name,payment_purpose,balance_eod. Dataset amount must be positive with at most two decimal places; map Поступление→inflow, Списание→outflow, parse exact decimal to minor units. INN remains text with leading zeros. Empty purpose/INN allowed with warnings. Explicit source_company_id selects rows of exactly one external company; aggregate file rows for other source companies are not imported and excluded count shown as warning, no tenant creation. Dataset file always selects record_kinds=[transactions,balance_observations]. First successful commit atomically binds the single account transaction_source to external (dataset_v1, selected source_company_id); another factual namespace or manual history gives 409 FACTUAL_SOURCE_CONFLICT. This authority also governs external balance imports. Per-source source_company_id is separately immutable (409 SOURCE_BINDING_CONFLICT); supplemental sources may coexist only for explicitly selected planned_payments. No binding is acquired by upload or preview alone. No mixed-company rows can mutate another tenant. Up to provisional 100 MiB/300000 rows; exceeded limit 413, no partial acceptance. Persist bytes+job before 202; no facts applied until preview commit. Equivalent aggregate/per-company inputs deduplicate by scoped external operation ID, independent of filename/hash. Invalid source selection/format gives failed import or 422 before enqueue, never silent success.'
      responses:
        '202':
          $ref: '#/components/responses/SuccessImportAccepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV bytes; synthetic dataset, not credentials.
                adapter:
                  type: string
                  enum:
                  - dataset_v1
                  examples:
                  - dataset_v1
                source_company_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  examples:
                  - C001
                account_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  examples:
                  - acc_123
                currency:
                  type: string
                  enum:
                  - RUB
                  examples:
                  - RUB
                  description: Provisional MVP convention, not a fact established by dataset. All current requests must use RUB; another currency is rejected without conversion.
              required:
              - file
              - adapter
              - source_company_id
              - account_id
              - currency
            encoding:
              file:
                contentType: text/csv
            example:
              file: <CSV binary bytes>
              adapter: dataset_v1
              source_company_id: C001
              account_id: acc_123
              currency: RUB
