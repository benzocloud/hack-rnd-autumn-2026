          type: integer
          examples:
          - 30
          minimum: 30
          maximum: 90
      required:
      - cutoff_date
      - horizon_days
      description: Explicit historical cutoff required for this dataset/demo; no silent use of future history. Server derives start_date=cutoff_date+1 calendar day; client must not send start_date; cutoff cannot be future in company timezone. Default-account snapshot and model context selected server-side and frozen transactionally with durable job. An accepted dated EOD balance at cutoff is required; missing cutoff balance cannot be replaced by an older statement balance. Fail with BALANCE_AS_OF_UNAVAILABLE rather than bridge unknown days with zeros. Existing newer facts are excluded; historical calendar inclusion requires demonstrable known_at<=cutoff.
