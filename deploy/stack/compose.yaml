name: saldo-stack

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
  pids_limit: 128
  logging:
    options: {max-size: 10m, max-file: '3'}
  networks: [private]

services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    env_file: [postgres.env]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/tls/server.pem, -c, ssl_key_file=/tls/server.key, -c, shared_buffers=64MB, -c, max_connections=30]
    volumes:
      - data:/var/lib/postgresql
      - ./pki/db:/tls:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-saldo.sh:ro
    networks: [private]
    mem_limit: 320m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U saldo_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: 10m, max-file: '3'}

  auth:
    <<: *runtime
    image: ${AUTH_IMAGE:?Set immutable AUTH_IMAGE}
    env_file: [auth.env]
    volumes: [./pki/auth:/tls:ro]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 192m
    cpus: 0.5

  core:
    <<: *runtime
    image: ${CORE_IMAGE:?Set immutable CORE_IMAGE}
    env_file: [core.env]
    volumes: [./pki/core:/tls:ro]
    depends_on: {postgres: {condition: service_healthy}, ml: {condition: service_started}}
    mem_limit: 160m
    cpus: 0.5

  ml:
    <<: *runtime
    image: ${ML_IMAGE:?Set immutable ML_IMAGE}
    command: [--host, 0.0.0.0, --port, '50051', --certificate, /tls/server.pem, --private-key, /tls/server.key, --client-ca, /tls/ca.pem, --allowed-peer, 'spiffe://saldo.local/core']
    volumes: [./pki/ml:/tls:ro]
    mem_limit: 192m
    cpus: 0.5

  api:
    <<: *runtime
    image: ${API_IMAGE:?Set immutable API_IMAGE}
    env_file: [api.env]
    volumes: [./pki/api:/tls:ro, api-import-spool:/var/lib/saldo/import-spool]
    networks:
      private: {}
      frontend: {aliases: [saldo-api]}
    depends_on: [auth, core]
    mem_limit: 128m
    cpus: 0.5

volumes:
  data:
  api-import-spool:

networks:
  private: {internal: true}
  frontend: {external: true, name: saldo-frontend_default}
