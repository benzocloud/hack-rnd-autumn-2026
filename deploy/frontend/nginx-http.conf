server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name saldo.brokebyte.me;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://saldo.brokebyte.me$request_uri;
    }
}
